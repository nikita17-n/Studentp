{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Portal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="sidebar">
    <h3>Student Portal</h3>

    <a href="/about/"><i class="fas fa-home"></i> Dashboard</a>
    <a href="/profile/"><i class="fas fa-user"></i> Profile</a>
    <a href="/attendance/"><i class="fas fa-calendar-check"></i> Attendance</a>
    <a href="/assignment/"><i class="fas fa-book"></i> Assignments</a>
    <a href="/result/"><i class="fas fa-chart-line"></i> Results</a>
    <a href="/fees/"><i class="fas fa-money-bill"></i> Fees</a>
    <a href="/notice/"><i class="fas fa-bell"></i> Notices</a>
    <a href="/login/"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div class="content">

    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <h4>{% block page_title %}Dashboard{% endblock %}</h4>
</html>
